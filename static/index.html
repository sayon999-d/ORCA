<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orca</title>
    <link rel="icon" href="static/favicon.svg?v=20260707-3" type="image/svg+xml" />
    <link rel="stylesheet" href="static/styles.css?v=20260707-2" />
  </head>
  <body>
    <main class="app-shell sidebar-hidden">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 128 128" focusable="false" role="img" aria-hidden="true">
              <defs>
                <linearGradient id="brandLogoBg" x1="16" y1="14" x2="112" y2="114" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#08111f" />
                  <stop offset="100%" stop-color="#102c5f" />
                </linearGradient>
                <linearGradient id="brandLogoBody" x1="26" y1="34" x2="104" y2="104" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#1e4ea6" />
                  <stop offset="55%" stop-color="#163d86" />
                  <stop offset="100%" stop-color="#0f2c64" />
                </linearGradient>
                <linearGradient id="brandLogoHighlight" x1="42" y1="46" x2="90" y2="86" gradientUnits="userSpaceOnUse">
                  <stop offset="0%" stop-color="#4f7ad1" stop-opacity="0.9" />
                  <stop offset="100%" stop-color="#2f5fbf" stop-opacity="0" />
                </linearGradient>
              </defs>
              <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#brandLogoBg)" />
              <path d="M28 76C31 55 46 38 69 33C84 30 96 34 105 43C98 45 92 50 89 57C99 61 105 70 105 80C105 93 95 104 82 106C66 109 50 104 38 95C31 90 26 84 28 76Z" fill="url(#brandLogoBody)" />
              <path d="M63 38C66 29 74 23 83 22C81 31 77 39 71 46L63 38Z" fill="#163c84" />
              <path d="M37 72C44 66 53 61 63 58C72 55 82 55 92 58C86 65 80 70 72 74C63 78 52 80 41 79C39 77 38 75 37 72Z" fill="url(#brandLogoHighlight)" />
              <ellipse cx="86" cy="56" rx="3.4" ry="4.2" fill="#d9e6ff" />
              <path d="M27 78C31 88 39 96 51 101C41 100 33 96 27 90C24 86 22 82 22 78H27Z" fill="#143268" />
              <path d="M102 79C104 83 104 88 102 93C97 101 90 105 81 106C91 100 97 92 99 84L102 79Z" fill="#143268" />
            </svg>
          </div>
          <div>
            <strong>Orca</strong>
            <span>Vision System</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="overview">
            <span>Overview</span>
          </button>
          <button class="nav-item" data-view="findings">
            <span>Findings</span>
          </button>
          <button class="nav-item" data-view="deep">
            <span>Deep Search</span>
          </button>
          <button class="nav-item" data-view="timeline">
            <span>Timeline</span>
          </button>
          <button class="nav-item" data-view="clusters">
            <span>Clusters</span>
          </button>
          <button class="nav-item" data-view="evidence">
            <span>Evidence</span>
          </button>
          <button class="nav-item" data-view="calibration">
            <span>Calibration</span>
          </button>
          <button class="nav-item" data-view="compare">
            <span>Compare</span>
          </button>
          <button class="nav-item" data-view="dataset">
            <span>Dataset</span>
          </button>
          <button class="nav-item" data-view="sessions">
            <span>Sessions</span>
          </button>
          <button class="nav-item" data-view="report">
            <span>Report</span>
          </button>
          <button class="nav-item" data-view="reviews">
            <span>Reviews</span>
          </button>
        </nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div class="title-row">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">Menu</button>
            <div class="brand-copy">
              <span class="eyebrow">Orca Vision System</span>
              <h1>Orca</h1>
              <p>Image intelligence dashboard</p>
            </div>
          </div>
          <div class="status-chip" id="modeBadge">
            <span class="status-dot"></span>
            <span>Live</span>
            <small>analysis</small>
          </div>
        </header>

        <section class="toolbar">
          <label class="file-control">
            <span>Image</span>
            <span class="file-picker">
              <input id="fileInput" type="file" accept="image/*" />
              <span class="file-button">Browse</span>
              <span id="selectedFileName" class="file-name">No image selected</span>
            </span>
          </label>
          <label class="prompt-control">
            <span>Search note</span>
            <input id="searchPromptInput" type="text" placeholder="Find repeated road-like grid patterns near bright clusters" />
          </label>
          <div class="toolbar-actions">
            <label class="depth-control">
              <span>Depth</span>
              <input id="depthInput" type="number" min="1" max="5" value="3" />
            </label>
            <button id="analyzeButton">Analyze</button>
            <button id="deepButton">Deep Search</button>
            <button id="saveSessionButton" type="button">Save Session</button>
          </div>
        </section>

        <section class="metrics-grid">
          <article class="metric-card">
            <span>Candidates</span>
            <strong id="candidateCount">0</strong>
          </article>
          <article class="metric-card">
            <span>Deep nodes</span>
            <strong id="deepCount">0</strong>
          </article>
          <article class="metric-card">
            <span>Reviews</span>
            <strong id="reviewCount">0</strong>
          </article>
          <article class="metric-card">
            <span>Model</span>
            <strong id="modelState">Idle</strong>
          </article>
        </section>

        <section class="content-grid">
          <article class="panel image-panel">
            <header class="panel-header">
              <div>
                <strong>Inspection</strong>
                <span id="imageMeta">No image selected</span>
              </div>
              <div class="canvas-tools" aria-label="Image zoom controls">
                <button id="zoomOutButton" type="button">-</button>
                <button id="zoomResetButton" type="button">100%</button>
                <button id="zoomInButton" type="button">+</button>
              </div>
            </header>
            <canvas id="previewCanvas" width="980" height="620"></canvas>
            <section class="pattern-profile">
              <header>
                <div>
                  <strong>Pattern profile</strong>
                  <span id="profileMeta">No pattern data yet</span>
                </div>
              </header>
              <canvas id="profileCanvas" width="980" height="180"></canvas>
            </section>
          </article>

          <article class="panel side-panel">
            <header class="panel-header">
              <div>
                <strong id="viewTitle">Overview</strong>
                <span id="viewSubtitle">Current analysis state</span>
              </div>
              <span class="panel-menu">⋮</span>
            </header>
            <div id="overview" class="view active"></div>
            <div id="findings" class="view"></div>
            <div id="deep" class="view"></div>
            <div id="timeline" class="view"></div>
            <div id="clusters" class="view"></div>
            <div id="evidence" class="view"></div>
            <div id="calibration" class="view"></div>
            <div id="compare" class="view"></div>
            <div id="dataset" class="view"></div>
            <div id="sessions" class="view"></div>
            <pre id="report" class="view"></pre>
            <div id="reviews" class="view"></div>
          </article>
        </section>
      </section>
    </main>
    <script src="static/orca-config.js?v=20260707-2"></script>
    <script src="static/app.js?v=20260707-2"></script>
  </body>
</html>
