  <text x="64" y="82" fill="#111317" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800">Orca pipeline architecture</text>
  <text x="64" y="116" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="18">The dashboard keeps the original image for inspection and sends a compressed analysis copy to the API when available.</text>

