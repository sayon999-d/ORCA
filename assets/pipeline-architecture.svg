  <text x="90" y="240" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="15">Original image</text>
  <text x="90" y="262" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="15">Canvas state</text>

  <rect x="306" y="172" width="198" height="102" rx="12" fill="#FFFFFF" stroke="#C9CCD2"/>
