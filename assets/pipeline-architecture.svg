  <text x="332" y="240" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="15">Resize large inputs</text>
  <text x="332" y="262" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="15">Compress API copy</text>

