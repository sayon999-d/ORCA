  <text x="590" y="262" fill="#72757D" font-family="Inter, Arial, sans-serif" font-size="15">Features and boxes</text>

  <rect x="822" y="172" width="198" height="102" rx="12" fill="#FFFFFF" stroke="#C9CCD2"/>
